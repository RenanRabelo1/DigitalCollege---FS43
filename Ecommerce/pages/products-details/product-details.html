<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Conheça os detalhes de um produto selecionado da Lumina."
    />
    <meta name="theme-color" content="#0c0c0f" />
    <title>Lumina | Detalhes do produto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="product-details.css" />
  </head>
  <body>
    <main class="detail-page">
      <div class="detail-layout">
        <section class="gallery" aria-label="Imagem do produto">
          <img id="product-image" class="product-image" src="" alt="" />
          <div class="gallery-overlay"></div>

          <header class="top-bar">
            <button id="back-button" class="icon-button" type="button" aria-label="Voltar">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
            <span>Product Details</span>
            <button
              id="favorite-button"
              class="icon-button favorite-button"
              type="button"
              aria-label="Adicionar aos favoritos"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.2l7.8-7.8 1.1-1.1a5.5 5.5 0 0 0-.1-7.7Z" />
              </svg>
            </button>
          </header>

          <div id="gallery-dots" class="gallery-dots" aria-label="Posição da imagem">
            <button class="gallery-dot is-active" type="button" data-position="0" aria-label="Imagem 1" aria-pressed="true"></button>
            <button class="gallery-dot" type="button" data-position="1" aria-label="Imagem 2" aria-pressed="false"></button>
            <button class="gallery-dot" type="button" data-position="2" aria-label="Imagem 3" aria-pressed="false"></button>
          </div>
        </section>

        <article class="product-content">
          <div id="product-tags" class="product-tags"></div>

          <h1 id="product-name"></h1>
          <p id="product-description" class="product-description"></p>

          <div class="rating-row" aria-label="Avaliação do produto">
            <span id="rating-stars" class="rating-stars" aria-hidden="true"></span>
            <strong id="rating-value"></strong>
            <span id="review-count"></span>
          </div>

          <section class="price-card" aria-label="Preço e entrega">
            <div class="price-row">
              <strong id="current-price" class="current-price"></strong>
              <span id="original-price" class="original-price"></span>
              <span id="discount" class="discount"></span>
            </div>
            <p id="installments" class="installments"></p>
            <div class="shipping-row">
              <p class="stock-info">
                <span class="check-icon" aria-hidden="true">✓</span>
                <span id="stock-label">Em estoque e pronto para envio</span>
              </p>
              <p class="shipping-info">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 4h14v12H1ZM15 9h4l4 4v3h-8Z" />
                  <circle cx="5" cy="18" r="2" />
                  <circle cx="19" cy="18" r="2" />
                </svg>
                Frete grátis
              </p>
            </div>
          </section>

          <section class="color-section" aria-labelledby="color-title">
            <h2 id="color-title">Cor: <span id="color-name"></span></h2>
            <div id="color-options" class="color-options"></div>
          </section>

          <section class="features-section" aria-labelledby="features-title">
            <h2 id="features-title">Detalhes do produto</h2>
            <div id="features-list" class="features-list"></div>
          </section>
        </article>
      </div>

      <footer class="action-bar">
        <button id="cart-button" class="secondary-action" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4ZM3 6h18M16 10a4 4 0 0 1-8 0" />
          </svg>
          <span>Carrinho</span>
        </button>
        <button id="buy-button" class="primary-action" type="button">Comprar agora</button>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="../../data/api.js"></script>
    <script src="../../data/products.js"></script>
    <script src="product-details.js"></script>
  </body>
</html>
