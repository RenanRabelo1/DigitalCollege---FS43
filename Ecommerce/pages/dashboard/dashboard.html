<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Dashboard da vendedora Lumina."
    />
    <meta name="theme-color" content="#0c0c0f" />
    <title>Lumina | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <main class="dashboard-page">
      <div class="dashboard-content">
        <header class="dashboard-header">
          <div class="brand" aria-label="Lumina">
            <span class="brand-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18M16 10a4 4 0 0 1-8 0" />
              </svg>
            </span>
            <span>Lumina</span>
          </div>
          <button id="logout-button" class="logout-button" type="button">Sair</button>
        </header>

        <section class="profile-summary" aria-labelledby="profile-name">
          <div class="avatar-wrap">
            <img id="profile-avatar" src="" alt="Foto de Mariana Silva" />
          </div>
          <h1 id="profile-name"></h1>
          <p id="profile-email"></p>
          <div class="profile-badges">
            <span id="profile-role" class="profile-badge"></span>
            <span id="profile-member" class="profile-badge profile-badge--accent"></span>
          </div>
        </section>

        <section class="dashboard-section data-section" aria-labelledby="data-title">
          <div class="section-heading">
            <h2 id="data-title">Meus dados</h2>
            <button id="edit-profile" class="text-button" type="button">Editar</button>
          </div>

          <div class="data-card">
            <div class="data-field">
              <label for="full-name">Nome completo</label>
              <input id="full-name" name="full-name" type="text" autocomplete="name" readonly />
              <p id="full-name-error" class="field-error" hidden></p>
            </div>
            <div class="data-field">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" autocomplete="email" readonly />
              <p id="email-error" class="field-error" hidden></p>
            </div>
            <div class="data-field">
              <label for="phone">Telefone</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" readonly />
              <p id="phone-error" class="field-error" hidden></p>
            </div>
          </div>
        </section>

        <section class="dashboard-section products-section" aria-labelledby="products-title">
          <div class="section-heading">
            <h2 id="products-title">Meus produtos</h2>
            <span id="product-count" class="item-count">0 itens</span>
          </div>

          <div id="dashboard-products" class="dashboard-products"></div>

          <div id="empty-state" class="empty-state" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <path d="M8 21h8m-4-4v4" />
            </svg>
            <strong>Nenhum produto cadastrado</strong>
            <p>Use o botão “+” para adicionar.</p>
          </div>
        </section>
      </div>

      <button id="add-product" class="add-product" type="button" aria-label="Adicionar produto">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>

      <nav class="bottom-nav" aria-label="Navegação principal">
        <button class="nav-button" type="button" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" />
          </svg>
          <span>Home</span>
        </button>
        <button class="nav-button" type="button" data-nav="explore">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="m16 8-2.5 5.5L8 16l2.5-5.5Z" />
          </svg>
          <span>Explore</span>
        </button>
        <button class="nav-button" type="button" data-nav="cart">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4ZM3 6h18M16 10a4 4 0 0 1-8 0" />
          </svg>
          <span>Cart</span>
        </button>
        <button class="nav-button is-active" type="button" data-nav="profile" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="7" r="4" />
            <path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1Z" />
          </svg>
          <span>Profile</span>
        </button>
      </nav>

      <div id="product-modal" class="modal" hidden>
        <button class="modal-backdrop" type="button" aria-label="Fechar formulário"></button>
        <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <header class="modal-header">
            <h2 id="modal-title">Novo produto</h2>
            <button id="close-modal" class="close-modal" type="button" aria-label="Fechar">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </header>

          <form id="product-form" novalidate>
            <div class="modal-field">
              <label for="product-name">Nome do produto *</label>
              <input id="product-name" name="product-name" type="text" placeholder="Ex: Camiseta Premium" />
              <p id="product-name-error" class="field-error" hidden></p>
            </div>
            <div class="modal-field">
              <label for="product-description">Descrição *</label>
              <textarea id="product-description" name="product-description" rows="3" placeholder="Descreva o produto..."></textarea>
              <p id="product-description-error" class="field-error" hidden></p>
            </div>
            <div class="form-grid">
              <div class="modal-field">
                <label for="product-price">Preço (R$) *</label>
                <input id="product-price" name="product-price" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="99,90" />
                <p id="product-price-error" class="field-error" hidden></p>
              </div>
              <div class="modal-field">
                <label for="product-category">Categoria *</label>
                <input
                  id="product-category"
                  name="product-category"
                  type="text"
                  list="category-options"
                  placeholder="Selecione ou crie"
                />
                <datalist id="category-options"></datalist>
                <p id="product-category-error" class="field-error" hidden></p>
              </div>
            </div>
            <div class="modal-field">
              <label for="product-image">URL da imagem *</label>
              <input id="product-image" name="product-image" type="url" inputmode="url" placeholder="https://..." />
              <p id="product-image-error" class="field-error" hidden></p>
            </div>
            <button id="save-product" class="save-product" type="submit">Cadastrar produto</button>
          </form>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="../../data/api.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
