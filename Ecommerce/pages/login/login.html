<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Acesse ou crie sua conta na Lumina."
    />
    <meta name="theme-color" content="#0c0c0f" />
    <title>Lumina | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="back-area">
        <button id="back-button" class="back-button" type="button" aria-label="Voltar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
      </div>

      <section class="login-content" aria-labelledby="page-title">
        <header class="brand-area">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
              <path d="M3 6h18M16 10a4 4 0 0 1-8 0" />
            </svg>
          </div>
          <h1 id="page-title">Lumina</h1>
          <p id="page-subtitle">Bem-vindo de volta</p>
        </header>

        <div class="mode-tabs" role="tablist" aria-label="Escolha entre entrar e cadastrar">
          <button
            id="login-tab"
            class="mode-tab is-active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="account-form"
            data-mode="login"
          >
            Entrar
          </button>
          <button
            id="signup-tab"
            class="mode-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="account-form"
            data-mode="signup"
          >
            Cadastrar
          </button>
        </div>

        <div id="form-message" class="form-message" role="status" aria-live="polite" hidden>
          <span class="message-icon" aria-hidden="true">!</span>
          <p></p>
        </div>

        <form id="account-form" novalidate>
          <div id="name-group" class="field-group" hidden>
            <label for="name">Nome completo</label>
            <div class="input-shell">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input
                id="name"
                name="name"
                type="text"
                autocomplete="name"
                placeholder="Seu nome completo"
              />
            </div>
            <p id="name-error" class="field-error" aria-live="polite" hidden></p>
          </div>

          <div class="field-group">
            <label for="email">E-mail</label>
            <div class="input-shell">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m22 6-10 7L2 6" />
              </svg>
              <input
                id="email"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="seu@email.com"
              />
            </div>
            <p id="email-hint" class="field-hint">Use: marianasilva@example.com</p>
            <p id="email-error" class="field-error" aria-live="polite" hidden></p>
          </div>

          <div class="field-group">
            <label for="password">Senha</label>
            <div class="input-shell input-shell--password">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
              />
              <button
                id="toggle-password"
                class="password-toggle"
                type="button"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden>
                  <path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.1-5.9M9.9 4.2A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 0 1-4.2-4.2M1 1l22 22" />
                </svg>
              </button>
            </div>
            <p id="password-error" class="field-error" aria-live="polite" hidden></p>
          </div>

          <div id="confirm-group" class="field-group" hidden>
            <label for="confirm-password">Confirmar senha</label>
            <div class="input-shell">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m20 6-11 11-5-5" />
              </svg>
              <input
                id="confirm-password"
                name="confirm-password"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••"
              />
            </div>
            <p id="confirm-error" class="field-error" aria-live="polite" hidden></p>
          </div>

          <button id="forgot-password" class="forgot-button" type="button">
            Esqueci minha senha
          </button>

          <button id="submit-button" class="submit-button" type="submit">
            <span class="submit-label">Entrar</span>
            <span class="loading-label" hidden>
              <span class="spinner" aria-hidden="true"></span>
              Aguarde...
            </span>
          </button>
        </form>

        <p class="switch-copy">
          <span id="switch-text">Não tem uma conta?</span>
          <button id="switch-mode" type="button">Cadastre-se</button>
        </p>

        <p class="prototype-note">Demonstração visual — nenhum dado é enviado.</p>
      </section>
    </main>

    <script src="../../data/api.js"></script>
    <script src="login.js"></script>
  </body>
</html>
